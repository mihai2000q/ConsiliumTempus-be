name: ct-dev
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: CT-Backend
    ports:
      - "${API_PORT}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      # should be defined in Development Environment to allow loading dotnet user-secrets locally
      - ASPNETCORE_ENVIRONMENT=Development
      # override the DatabaseSettings of the appsettings files, so the .env is the single source in Docker
      - DatabaseSettings__Server=database
      - DatabaseSettings__Port=1433
      - DatabaseSettings__Name=${DATABASE_NAME}
      - DatabaseSettings__User=${DATABASE_USER}
      - DatabaseSettings__Password=${DATABASE_PASSWORD}
    healthcheck:
      # the aspnet image has no curl or wget, so the request is sent through bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /api/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      # map the dotnet user-secret folder (defaults to the Windows location, set USER_SECRETS_PATH on Linux/macOS)
      - ${USER_SECRETS_PATH:-${APPDATA}/Microsoft/UserSecrets}:/root/.microsoft/usersecrets:ro

  # one-shot service that applies the EF migrations to the database, then exits
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: CT-Migrator
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    command:
      - "--connection"
      - "Server=database,1433;Database=${DATABASE_NAME};User Id=${DATABASE_USER};Password=${DATABASE_PASSWORD};Encrypt=false"

  # one-shot service that inserts the sample data, once the database is migrated (only when enabled in the .env)
  sample-data:
    build:
      context: .
      dockerfile: Dockerfile
      target: sample-data
    container_name: CT-SampleData
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - SampleData__Enabled=${SAMPLE_DATA_ENABLED:-false}
    command:
      - "--connection"
      - "Server=database,1433;Database=${DATABASE_NAME};User Id=${DATABASE_USER};Password=${DATABASE_PASSWORD};Encrypt=false"

  database:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: CT-Database
    ports:
      - "${DATABASE_PORT}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: $$(ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -n 1) -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      # a named volume, because SQL Server can't run on a bind mount of a Windows folder
      - database-data:/var/opt/mssql

volumes:
  database-data:
