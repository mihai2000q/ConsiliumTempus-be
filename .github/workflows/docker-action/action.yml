name: Setup Docker Environment

description: 'Action for setting up the Docker Environment'

inputs:
  secret-key:
    description: 'Secret Key used for JWT Settings'
    required: true

runs:
  using: 'composite'
  steps:
  - name: Add JWT Settings Secret Key on appsettings
    shell: bash
    env:
      SECRET_KEY: ${{ inputs.secret-key }}
    run: |
      perl -pi -e 's/"SecretKey": ""/"SecretKey": "$ENV{SECRET_KEY}"/g' ./src/ConsiliumTempus.Api/appsettings.json
      if grep -q '"SecretKey": ""' ./src/ConsiliumTempus.Api/appsettings.json; then
        echo "SecretKey placeholder was not replaced"
        exit 1
      fi

  - name: Copy Environment File (.env)
    shell: bash
    run: cp .env.dev .env

  - name: Run Docker Containers
    shell: bash
    run: docker compose -f docker-compose-prod.yml up -d --build --wait
