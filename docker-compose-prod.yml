name: consilium-tempus
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: CT-Backend
    ports:
      - "${API_PORT}:8080"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: CT-Database
    ports:
      - "${DATABASE_PORT}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: $$(ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -n 1) -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    volumes:
      - database-data:/var/opt/mssql

volumes:
  database-data:
